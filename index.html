<body>
    <div id="app">
        <!-- 高级极客风 Loading 样式 -->
        <style>
            .loading-container {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: #f8f9fa;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                color: #212529;
            }

            .loading-logo {
                font-size: 3.2rem;
                margin-bottom: 16px;
                animation: pulseLogo 1.6s infinite ease-in-out;
            }

            .loading-title {
                font-size: 1.25rem;
                font-weight: 700;
                color: #1f2328;
                margin-bottom: 6px;
                letter-spacing: 0.5px;
            }

            .loading-sub {
                font-size: 0.88rem;
                color: #6c757d;
                margin-bottom: 24px;
            }

            /* 极速流光进度条 */
            .loading-progress-bar {
                width: 220px;
                height: 4px;
                background-color: #e9ecef;
                border-radius: 4px;
                overflow: hidden;
                position: relative;
            }

            .loading-progress-value {
                width: 100%;
                height: 100%;
                background: linear-gradient(90deg, #2da44e, #0969da);
                border-radius: 4px;
                animation: loadingSlide 1.2s infinite ease-in-out;
                transform-origin: 0% 50%;
            }

            @keyframes pulseLogo {
                0%, 100% {
                    transform: scale(1);
                    opacity: 1;
                }

                50% {
                    transform: scale(1.12);
                    opacity: 0.8;
                }
            }

            @keyframes loadingSlide {
                0% {
                    transform: translateX(-100%);
                }

                100% {
                    transform: translateX(100%);
                }
            }
        </style>

        <div class="loading-container">
            <div class="loading-logo">⚡</div>
            <div class="loading-title">Swen 的技术空间</div>
            <div class="loading-sub">正在初始化 .NET WebAssembly 引擎...</div>
            <div class="loading-progress-bar">
                <div class="loading-progress-value"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
