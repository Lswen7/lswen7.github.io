        <!-- 高级极客风 Loading 样式 -->
        <style>
            .loading-container {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: #f8f9fa;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                color: #212529;

            .loading-logo {

            }

            .loading-title {

                font-weight: 700;
                color: #1f2328;
                margin-bottom: 6px;
                letter-spacing: 0.5px;
            }

            .loading-sub {
                font-size: 0.88rem;
                color: #6c757d;
                margin-bottom: 24px;
            }

            /* 极速流光进度条 */
            .loading-progress-bar {
                width: 220px;
                height: 4px;
                background-color: #e9ecef;
                border-radius: 4px;
                overflow: hidden;
                position: relative;
            }

            .loading-progress-value {
                width: 100%;
                height: 100%;
                background: linear-gradient(90deg, #2da44e, #0969da);
                border-radius: 4px;
                animation: loadingSlide 1.2s infinite ease-in-out;
                transform-origin: 0% 50%;
            }

            @keyframes pulseLogo {
                0%, 100% {
                    transform: scale(1);
                    opacity: 1;
                }

                50% {
                    transform: scale(1.12);
                    opacity: 0.8;
                }
            }

            @keyframes loadingSlide {
                0% {
                    transform: translateX(-100%);
                }

                100% {
                    transform: translateX(100%);
                }
            }
        </style>

    <!-- 100% 本地原生运行的科技感粒子蛛网磁吸背景特效 -->
    <script>
        (function () {
            function createParticleCanvas() {
                var canvas = document.createElement('canvas');
                canvas.style.cssText = 'position:fixed;top:0;left:0;z-index:-1;opacity:0.75;pointer-events:none;';
                document.body.appendChild(canvas);

                var ctx = canvas.getContext('2d');
                var width, height;

                function resize() {
                    width = canvas.width = window.innerWidth || document.documentElement.clientWidth;
                    height = canvas.height = window.innerHeight || document.documentElement.clientHeight;
                }
                resize();
                window.addEventListener('resize', resize);

                var mouse = { x: null, y: null, max: 20000 };
                window.addEventListener('mousemove', function (e) {
                    mouse.x = e.clientX;
                    mouse.y = e.clientY;
                });
                window.addEventListener('mouseout', function () {
                    mouse.x = null;
                    mouse.y = null;
                });

                var particles = [];
                for (var i = 0; i < 90; i++) {
                    particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        xa: (Math.random() * 2 - 1) * 0.8,
                        ya: (Math.random() * 2 - 1) * 0.8,
                        max: 6000
                    });
                }

                var all = particles.concat([mouse]);

                function draw() {
                    ctx.clearRect(0, 0, width, height);

                    particles.forEach(function (dot, idx) {
                        dot.x += dot.xa;
                        dot.y += dot.ya;

                        dot.xa *= (dot.x > width || dot.x < 0) ? -1 : 1;
                        dot.ya *= (dot.y > height || dot.y < 0) ? -1 : 1;

                        ctx.fillStyle = '#0969da';
                        ctx.fillRect(dot.x - 0.5, dot.y - 0.5, 2, 2);

                        for (var i = idx + 1; i < all.length; i++) {
                            var d = all[i];
                            if (d.x !== null && d.y !== null) {
                                var xc = dot.x - d.x;
                                var yc = dot.y - d.y;
                                var dis = xc * xc + yc * yc;

                                if (dis < d.max) {
                                    if (d === mouse && dis >= d.max / 2) {
                                        dot.x -= xc * 0.03;
                                        dot.y -= yc * 0.03;
                                    }
                                    var ratio = (d.max - dis) / d.max;
                                    ctx.beginPath();
                                    ctx.lineWidth = ratio / 2;
                                    ctx.strokeStyle = 'rgba(45, 164, 78, ' + (ratio + 0.2) + ')';
                                    ctx.moveTo(dot.x, dot.y);
                                    ctx.lineTo(d.x, d.y);
                                    ctx.stroke();
                                }
                            }
                        }
                    });
                    requestAnimationFrame(draw);
                }
                draw();
            }
            if (document.readyState === 'complete') {
                createParticleCanvas();
            } else {
                window.addEventListener('load', createParticleCanvas);
            }
        })();
    </script>
