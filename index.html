<body>
    <div id="app">
        <!-- 极致纯粹：仅保留全屏电光 + 闪电图标 + 霓虹标题 -->
        <style>
            .lightning-loader-wrapper {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                background: #060911;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                user-select: none;
                overflow: hidden;
                z-index: 9999;
            }

            #lightningCanvas {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
            }

            /* 纯透明文字容器：去掉了毛玻璃、边框、背景与阴影 */
            .loading-content {
                position: relative;
                z-index: 2;
                display: flex;
                flex-direction: column;
                align-items: center;
                background: transparent;
                border: none;
                box-shadow: none;
            }

            .lightning-icon {
                font-size: 4.5rem;
                margin-bottom: 12px;
                filter: drop-shadow(0 0 20px #ffd700);
                animation: electricPulse 0.7s infinite alternate ease-in-out;
            }

            .loading-title {
                font-size: 2rem;
                font-weight: 800;
                color: #ffffff;
                text-shadow: 0 0 16px rgba(0, 243, 255, 1), 0 0 30px rgba(0, 243, 255, 0.6);
                letter-spacing: 3px;
            }

            @keyframes electricPulse {
                0% {
                    transform: scale(0.95);
                    filter: drop-shadow(0 0 10px #ffd700);
                }

                100% {
                    transform: scale(1.15);
                    filter: drop-shadow(0 0 35px #ffd700);
                }
            }
        </style>

        <div class="lightning-loader-wrapper">
            <canvas id="lightningCanvas"></canvas>
            <div class="loading-content">
                <div class="lightning-icon">⚡</div>
                <div class="loading-title">Swen 的技术空间</div>
            </div>
        </div>

        <!-- 实时电光流动生成算法脚本 -->
        <script>
            (function () {
                var canvas = document.getElementById('lightningCanvas');
                if (!canvas) return;
                var ctx = canvas.getContext('2d');
                var width, height;

                function resize() {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                }
                resize();
                window.addEventListener('resize', resize);

                function createLightningPath(x1, y1, x2, y2, displacement) {
                    if (displacement < 3) {
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.stroke();
                        return;
                    }
                    var midX = (x1 + x2) / 2 + (Math.random() - 0.5) * displacement;
                    var midY = (y1 + y2) / 2 + (Math.random() - 0.5) * displacement;
                    createLightningPath(x1, y1, midX, midY, displacement / 2);
                    createLightningPath(midX, midY, x2, y2, displacement / 2);

                    if (Math.random() < 0.2) {
                        var branchX = midX + (Math.random() - 0.5) * displacement;
                        var branchY = midY + (Math.random() - 0.5) * displacement;
                        createLightningPath(midX, midY, branchX, branchY, displacement / 3);
                    }
                }

                function drawLightning() {
                    ctx.clearRect(0, 0, width, height);

                    var grad = ctx.createRadialGradient(width / 2, height / 2, 50, width / 2, height / 2, width * 0.7);
                    grad.addColorStop(0, 'rgba(0, 243, 255, 0.12)');
                    grad.addColorStop(1, 'rgba(6, 9, 17, 0)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, width, height);

                    var boltCount = Math.floor(Math.random() * 3) + 3;
                    for (var i = 0; i < boltCount; i++) {
                        var startX = width / 2 + (Math.random() - 0.5) * 100;
                        var startY = height / 2 + (Math.random() - 0.5) * 100;

                        var angle = Math.random() * Math.PI * 2;
                        var distance = Math.max(width, height) * 0.85;
                        var endX = startX + Math.cos(angle) * distance;
                        var endY = startY + Math.sin(angle) * distance;

                        ctx.strokeStyle = 'rgba(0, 243, 255, 0.85)';
                        ctx.lineWidth = 2.5;
                        ctx.shadowColor = '#00f3ff';
                        ctx.shadowBlur = 20;
                        createLightningPath(startX, startY, endX, endY, 110);

                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 1.2;
                        ctx.shadowColor = '#ffffff';
                        ctx.shadowBlur = 8;
                        createLightningPath(startX, startY, endX, endY, 110);
                    }
                    requestAnimationFrame(drawLightning);
                }

                drawLightning();
            })();
        </script>

    <!-- 100% 本地原生运行的科技感粒子蛛网磁吸背景特效 -->
    <script>
        (function () {
            function createParticleCanvas() {
                var canvas = document.createElement('canvas');
                canvas.style.cssText = 'position:fixed;top:0;left:0;z-index:-1;opacity:0.75;pointer-events:none;';
                document.body.appendChild(canvas);

                var ctx = canvas.getContext('2d');
                var width, height;

                function resize() {
                    width = canvas.width = window.innerWidth || document.documentElement.clientWidth;
                    height = canvas.height = window.innerHeight || document.documentElement.clientHeight;
                }
                resize();
                window.addEventListener('resize', resize);

                var mouse = { x: null, y: null, max: 20000 };
                window.addEventListener('mousemove', function (e) {
                    mouse.x = e.clientX;
                    mouse.y = e.clientY;
                });
                window.addEventListener('mouseout', function () {
                    mouse.x = null;
                    mouse.y = null;
                });

                var particles = [];
                for (var i = 0; i < 90; i++) {
                    particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        xa: (Math.random() * 2 - 1) * 0.8,
                        ya: (Math.random() * 2 - 1) * 0.8,
                        max: 6000
                    });
                }

                var all = particles.concat([mouse]);

                function draw() {
                    ctx.clearRect(0, 0, width, height);

                    particles.forEach(function (dot, idx) {
                        dot.x += dot.xa;
                        dot.y += dot.ya;

                        dot.xa *= (dot.x > width || dot.x < 0) ? -1 : 1;
                        dot.ya *= (dot.y > height || dot.y < 0) ? -1 : 1;

                        ctx.fillStyle = '#0969da';
                        ctx.fillRect(dot.x - 0.5, dot.y - 0.5, 2, 2);

                        for (var i = idx + 1; i < all.length; i++) {
                            var d = all[i];
                            if (d.x !== null && d.y !== null) {
                                var xc = dot.x - d.x;
                                var yc = dot.y - d.y;
                                var dis = xc * xc + yc * yc;

                                if (dis < d.max) {
                                    if (d === mouse && dis >= d.max / 2) {
                                        dot.x -= xc * 0.03;
                                        dot.y -= yc * 0.03;
                                    }
                                    var ratio = (d.max - dis) / d.max;
                                    ctx.beginPath();
                                    ctx.lineWidth = ratio / 2;
                                    ctx.strokeStyle = 'rgba(45, 164, 78, ' + (ratio + 0.2) + ')';
                                    ctx.moveTo(dot.x, dot.y);
                                    ctx.lineTo(d.x, d.y);
                                    ctx.stroke();
                                }
                            }
                        }
                    });
                    requestAnimationFrame(draw);
                }
                draw();
            }
            if (document.readyState === 'complete') {
                createParticleCanvas();
            } else {
                window.addEventListener('load', createParticleCanvas);
            }
        })();
    </script>
